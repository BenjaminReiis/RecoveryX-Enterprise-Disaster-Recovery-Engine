[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "recoveryx"
version = "0.1.0"
description = "RecoveryX: enterprise disaster recovery engine."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = []

[project.scripts]
recoveryx = "recoveryx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
